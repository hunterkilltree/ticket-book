name: ticket-booking

# Runs the whole stack as plain Docker containers (no Kubernetes).
# Images are produced by infrastructure/build-images.sh (ticketbooking/<svc>:local + frontend).
# Quick start:  ./start.sh    (builds images, then `docker compose up -d`)
# Or manually:  ./infrastructure/build-images.sh && docker compose up -d

x-common-env: &common-env
  KAFKA_BROKERS: kafka:9092
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  ELASTICSEARCH_URI: http://elasticsearch:9200
  MAIL_HOST: mailhog
  MAIL_PORT: "1025"
  DB_USER: postgres
  DB_PASSWORD: postgres
  JWT_SECRET: local-dev-jwt-secret-change-me-at-least-32-bytes

services:
  # --- backing infrastructure ------------------------------------------------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./infrastructure/docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"   # web UI

  # --- application services --------------------------------------------------
  user-service:
    image: ticketbooking/user-service:local
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/userdb
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    restart: unless-stopped

  event-service:
    image: ticketbooking/event-service:local
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/eventdb
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    restart: unless-stopped

  search-service:
    image: ticketbooking/search-service:local
    environment:
      <<: *common-env
    depends_on:
      elasticsearch: { condition: service_started }
      kafka: { condition: service_healthy }
    restart: unless-stopped

  booking-service:
    image: ticketbooking/booking-service:local
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/bookingdb
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
    restart: unless-stopped

  order-service:
    image: ticketbooking/order-service:local
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/orderdb
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    restart: unless-stopped

  payment-service:
    image: ticketbooking/payment-service:local
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/paymentdb
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    restart: unless-stopped

  ticket-service:
    image: ticketbooking/ticket-service:local
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/ticketdb
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    restart: unless-stopped

  notification-service:
    image: ticketbooking/notification-service:local
    environment:
      <<: *common-env
    depends_on:
      kafka: { condition: service_healthy }
    restart: unless-stopped

  admin-service:
    image: ticketbooking/admin-service:local
    environment:
      <<: *common-env
      DB_URL: jdbc:postgresql://postgres:5432/admindb
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  gateway:
    image: ticketbooking/gateway:local
    environment:
      USER_SERVICE_URL: http://user-service:8081
      EVENT_SERVICE_URL: http://event-service:8082
      SEARCH_SERVICE_URL: http://search-service:8083
      BOOKING_SERVICE_URL: http://booking-service:8084
      ORDER_SERVICE_URL: http://order-service:8085
      PAYMENT_SERVICE_URL: http://payment-service:8086
      TICKET_SERVICE_URL: http://ticket-service:8087
      ADMIN_SERVICE_URL: http://admin-service:8089
    restart: unless-stopped

  # --- frontend + edge -------------------------------------------------------
  frontend:
    image: ticketbooking/frontend:local
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/docker/nginx.compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - user-service
      - event-service
      - search-service
      - booking-service
      - order-service
      - payment-service
      - ticket-service
      - admin-service
    restart: unless-stopped

volumes:
  pgdata:
