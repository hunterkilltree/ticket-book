resolver 127.0.0.11 valid=10s ipv6=off;   # Docker embedded DNS

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream user_svc     { server user-service:8081; }
upstream event_svc    { server event-service:8082; }
upstream search_svc   { server search-service:8083; }
upstream booking_svc  { server booking-service:8084; }
upstream order_svc    { server order-service:8085; }
upstream payment_svc  { server payment-service:8086; }
upstream ticket_svc   { server ticket-service:8087; }
upstream admin_svc    { server admin-service:8089; }
upstream gateway_svc  { server gateway:8080; }
upstream frontend_svc { server frontend:80; }

server {
  listen 80;
  server_name _;

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s;
  proxy_read_timeout    60s;

  location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

  location /api/users    { proxy_pass http://user_svc;    }
  location /api/events   { proxy_pass http://event_svc;   }
  location /api/venues   { proxy_pass http://event_svc;   }
  location /api/search   { proxy_pass http://search_svc;  }
  location /api/orders   { proxy_pass http://order_svc;   }
  location /api/payments { proxy_pass http://payment_svc; }
  location /api/tickets  { proxy_pass http://ticket_svc;  }
  location /api/admin    { proxy_pass http://admin_svc;   }

  location /api/bookings {
    proxy_pass http://booking_svc;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
  location /ws {
    proxy_pass http://booking_svc;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  location / { proxy_pass http://frontend_svc; }
}
